<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Directory - Community Resource Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<nav>
  <div class="nav-inner container">
    <div class="brand">Community Resource Hub</div>
    <a href="index.html">Home</a>
    <a href="resources.html">Resources</a>
    <a href="submit.html">Add resource</a>
  </div>
</nav>

<header class="header-hero">
  <div class="container">
    <h1>Resource directory</h1>
    <p>Search and filter local services, non-profits, and programs.</p>
  </div>
</header>

<main class="container" style="padding-top:18px">
  <div class="card">
    <div class="search-row">
      <input id="search" class="input" placeholder="Search name or description">
      <select id="category-filter" class="input"></select>
      <select id="location-filter" class="input"></select>
      <button id="clear-filters" class="input">Clear</button>
    </div>

    <div id="results" class="grid cols-3" style="margin-top:12px"></div>
  </div>

  <div style="height:20px"></div>
  <div class="footer">If you add a resource with the submit form, it will appear here.</div>
</main>

<script src="script.js"></script>
</body>
</html>
